name: Verify and stage Arch Lens release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Verify release commit is current main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - name: Install and verify the managed PlantUML runtime
        run: node bin/arch-lens.js init --json
      - run: npm test
      - name: Verify workflow protocol contract
        run: node bin/arch-lens.js capabilities --json
      - name: Validate cross-process managed runtime discovery and render repository diagrams
        run: |
          node bin/arch-lens.js diagrams check
          node bin/arch-lens.js diagrams render --output "$RUNNER_TEMP/arch-lens-rendered"
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: npm pack --dry-run

  stage:
    name: Stage npm package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install staging-capable npm
        run: npm install --global npm@11.15.0
      - run: npm ci
      - name: Derive npm dist-tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-alpha.*) tag="next" ;;
            *-beta.*|*-rc.*) tag="beta" ;;
            *) tag="latest" ;;
          esac
          echo "NPM_DIST_TAG=$tag" >> "$GITHUB_ENV"
          echo "Staging $version with npm dist-tag: $tag"
      - name: Stage package for maintainer approval
        run: npm stage publish --access public --tag "$NPM_DIST_TAG"

# CI 只验证产物并将 tag 对应版本暂存到 npm；最终发布必须由维护者使用 2FA 在 npm 端批准。
